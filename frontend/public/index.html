            { "@type": "Question", "name": "What is cosmetic dentistry?", "acceptedAnswer": { "@type": "Answer", "text": "Cosmetic dentistry focuses on the appearance of your smile — straighter, whiter and well-shaped teeth — while protecting your oral health. At GM Dental Rochester it can include Invisalign clear aligners, teeth whitening, composite bonding, veneers, cosmetic crowns and smile makeovers." } },

            { "@type": "Question", "name": "What is Invisalign?", "acceptedAnswer": { "@type": "Answer", "text": "Invisalign is a series of custom-made, nearly invisible clear aligners that fit over your teeth and gently move them into a planned position. They are removable for eating and cleaning." } },
            { "@type": "Question", "name": "How does Invisalign treatment work?", "acceptedAnswer": { "@type": "Answer", "text": "Your dentist assesses your smile and scans your teeth with the iTero scanner, then builds a personalised plan with a smile simulation showing how your new smile could look. You wear a series of aligners for the recommended hours each day, changing them as directed, with reviews at the clinic. Duration depends on your individual case." } },
            { "@type": "Question", "name": "How much does Invisalign cost?", "acceptedAnswer": { "@type": "Answer", "text": "Current Invisalign packages at our Rochester clinic are £2,400, £3,000 and £3,990. The exact cost depends on your clinical assessment and the treatment plan you agree." } },
            { "@type": "Question", "name": "What is included in the current Invisalign offer?", "acceptedAnswer": { "@type": "Answer", "text": "The initial assessment is free and includes a smile simulation. The three package prices are £2,400, £3,000 and £3,990; supporting options include an iTero digital scan (£65) and professional teeth whitening (£348). Package inclusions and any additional costs are confirmed at your assessment." } },
            { "@type": "Question", "name": "Is finance available?", "acceptedAnswer": { "@type": "Answer", "text": "Finance is available from £50.40 per month (representative example). Eligibility, deposit and terms are subject to status and confirmed in writing before you commit to anything." } },
            { "@type": "Question", "name": "Can I combine Invisalign with other cosmetic treatments?", "acceptedAnswer": { "@type": "Answer", "text": "Often, yes. Treatments such as whitening or composite bonding are commonly planned after or alongside clear aligner treatment. Your dentist will advise what is safe and appropriate for your teeth." } },
            { "@type": "Question", "name": "How do I arrange a consultation in Rochester?", "acceptedAnswer": { "@type": "Answer", "text": "Complete the form on this page, send us a WhatsApp message, or call the clinic. Our team will arrange your free initial assessment at GM Dental Rochester." } },
